<section
  class="flex flex-col bg-white border border-[var(--color-border)] rounded-xl w-[300px] min-h-[220px] p-5 shadow-sm transition hover:-translate-y-1 hover:shadow-lg hover:border-[#c7ced8]"
>
  <header
    class="flex justify-between items-start gap-4 pb-4 border-b border-[#e5e7eb]"
  >
    <div class="min-w-0 flex-1">
      <p
        class="m-0 mb-1 text-[11px] font-bold tracking-widest text-[#6b7280]"
      >
        PRODUCTO
      </p>

      <h2
        class="m-0 text-[20px] font-bold truncate"
        [title]="producto().nombre"
      >
        {{ producto().nombre }}
      </h2>
    </div>
  </header>

  <div class="flex flex-col gap-1 py-4">
    <span
      class="text-[11px] font-bold tracking-wide text-[#6b7280]"
    >
      PRECIO
    </span>

    <span class="text-lg font-bold">
      ${{ producto().precio }}
    </span>
  </div>

  <div class="mt-auto pt-3 flex justify-end">
    <button
      type="button"
      (click)="eliminar.emit()"
      class="px-4 py-2 rounded-md text-[13px] font-bold border bg-white text-[#b3261e] border-[#f5c6c3] hover:bg-[#fdecec] transition"
    >
      Eliminar
    </button>
  </div>
</section>
