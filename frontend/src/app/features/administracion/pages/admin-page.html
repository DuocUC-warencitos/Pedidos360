<div class="w-full mx-auto p-6">
    <section class="mb-4">
        <nav
            class="mt-3 flex justify-center gap-2 p-1.5 bg-white border border-border rounded-xl shadow-sm"
        >
            <a
                routerLink="/admin/rabbitmq"
                routerLinkActive="activo"
                [routerLinkActiveOptions]="{ exact: true }"
                class="px-5 py-2.5 rounded-lg text-muted no-underline font-bold transition hover:text-[#1f2937] hover:bg-[#f3f4f6] hover:-translate-y-px [&.activo]:bg-[#1976d2] [&.activo]:text-white"
            >
                RabbitMQ
            </a>

            <a
                routerLink="/admin/productos"
                routerLinkActive="activo"
                [routerLinkActiveOptions]="{ exact: false }"
                class="px-5 py-2.5 rounded-lg text-muted no-underline font-bold transition hover:text-[#1f2937] hover:bg-[#f3f4f6] hover:-translate-y-px [&.activo]:bg-[#1976d2] [&.activo]:text-white"
            >
                Productos
            </a>

            <a
                routerLink="/admin/pedidos"
                routerLinkActive="activo"
                [routerLinkActiveOptions]="{ exact: false }"
                class="px-5 py-2.5 rounded-lg text-muted no-underline font-bold transition hover:text-[#1f2937] hover:bg-[#f3f4f6] hover:-translate-y-px [&.activo]:bg-[#1976d2] [&.activo]:text-white"
            >
                Pedidos
            </a>
        </nav>
    </section>

    <router-outlet />
</div>
