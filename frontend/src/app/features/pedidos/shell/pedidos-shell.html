<section class="w-full mx-auto p-6">
  @if (user()) {
    <nav
      class="flex justify-center gap-2 mb-8 p-1.5 bg-white border border-border rounded-xl shadow-sm"
    >
      <a
        [routerLink]="['./lista']"
        routerLinkActive="activo"
        [routerLinkActiveOptions]="{ exact: false }"
        class="px-5 py-2.5 rounded-lg text-muted no-underline font-bold transition hover:text-[#1f2937] hover:bg-[#f3f4f6] hover:-translate-y-px [&.activo]:bg-[#1976d2] [&.activo]:text-white"
      >
        Pedidos
      </a>
      <a
        [routerLink]="['./crear']"
        routerLinkActive="activo"
        class="px-5 py-2.5 rounded-lg text-muted no-underline font-bold transition hover:text-[#1f2937] hover:bg-[#f3f4f6] hover:-translate-y-px [&.activo]:bg-[#1976d2] [&.activo]:text-white"
      >
        Crear pedido
      </a>
    </nav>

    <router-outlet />
  } @else {
    <div class="mx-auto flex max-w-lg flex-col items-center rounded-2xl border border-dashed border-gray-300 bg-white px-6 py-14 text-center">
      <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gray-100">
        <span class="text-2xl">🔒</span>
      </div>

      <h2 class="m-0 text-xl font-bold text-gray-900">
        Para entrar aquí tienes que estar logeado
      </h2>

      <p class="mb-6 mt-2 max-w-sm text-sm text-gray-600">
        Tus pedidos son privados. Inicia sesión para ver tu historial, crear pedidos y seguir tus compras.
      </p>

      <div class="flex flex-wrap items-center justify-center gap-3">
        <button
          type="button"
          (click)="login()"
          class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700"
        >
          Iniciar sesión
        </button>

        <a
          [routerLink]="['/productos/catalogo']"
          class="inline-flex items-center justify-center rounded-lg border border-gray-200 px-4 py-2.5 text-sm font-semibold text-gray-700 no-underline transition hover:bg-gray-50"
        >
          Explorar catálogo
        </a>
      </div>
    </div>
  }
</section>
