<div>
    <h1>Pedidos realizados</h1>
    <div>
        @if(pedidos().length === 0)
        {
            <h2>No hay pedidos</h2>
        }
        @else 
        {
            <div>
                @for (pedido of pedidos(); track pedido.createdAt)
                {
                    <app-pedido-card [pedido]="pedido"/>
                }
            </div>
        }
    </div>
</div>
