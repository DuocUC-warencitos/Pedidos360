<div class="pedidos-list">
    <h1>Pedidos realizados</h1>
    <div>
        @if (pedidosQuery.isLoading())
        {
            <h2>Cargando pedidos...</h2>
        }
        @else if (pedidosQuery.isError())
        {
            <h2>Error al cargar pedidos</h2>
        }
        @else if ((pedidosQuery.data() ?? []).length === 0)
        {
            <h2>No hay pedidos</h2>
        }
        @else
        {
            <div class="lista-pedidos">

                @for (pedido of pedidosQuery.data(); track pedido.createdAt)
                {
                    <app-pedido-card [pedido]="pedido" />
                }

            </div>
        }
    </div>
</div>
