server:
    port: ${SERVER_PORT:8080}

spring:
    application:
        name: pedidos-service
    datasource:
        url: ${SPRING_DATASOURCE_URL:}
        username: ${SPRING_DATASOURCE_USERNAME:}
        password: ${SPRING_DATASOURCE_PASSWORD:}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        open-in-view: false
        database-platform: org.hibernate.dialect.PostgreSQLDialect
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${JWT_ISSUER_URI:}
    jackson:
        default-property-inclusion: non_null
    cloud:
        openfeign:
            client:
                config:
                    productoService:
                        connect-timeout: 2000
                        read-timeout: 3000
                        logger-level: basic
    rabbitmq:
        host: ${RABBITMQ_HOST}
        port: ${RABBITMQ_PORT}
        username: ${RABBITMQ_USERNAME}
        password: ${RABBITMQ_PASSWORD}
        listener:
            simple:
                acknowledge-mode: manual
                prefetch: 10
                concurrency: 4
                max-concurrency: 16

resilience4j:
    retry:
        instances:
            productoService:
                ignore-exceptions:
                    - io.github.roony11_1.pedidos_service.infrastructure.client.ReservaStockRechazadaException
    circuitbreaker:
        instances:
            productoService:
                ignore-exceptions:
                    - io.github.roony11_1.pedidos_service.infrastructure.client.ReservaStockRechazadaException

app:
    security:
        cors:
            enabled: ${CORS_ENABLED:true}
            allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    producto-service:
        url: ${PRODUCTO_SERVICE_URL:}
        internal-api-key: ${INTERNAL_API_KEY:}