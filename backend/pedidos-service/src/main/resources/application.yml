server:
    port: ${SERVER_PORT:8081}

spring:
    datasource:
        url: ${DATABASE_URL:jdbc:postgresql://localhost:5431/pedidos}
        username: ${PEDIDOS_DB_USER:user}
        password: ${PEDIDOS_DB_PASS:pass}
    application:
        name: pedidos-service
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        open-in-view: false