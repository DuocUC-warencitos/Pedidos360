server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pedidos-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: pedidos-service
              uri: ${PEDIDOS_SERVICE_URL:http://pedidos-service:8080}
              predicates:
                - Path=/api/v1/pedidos/**

            - id: pedidos-service-admin
              uri: ${PEDIDOS_SERVICE_URL:http://pedidos-service:8080}
              predicates:
                - Path=/api/v1/admin/pedidos/**

            - id: productos-service
              uri: ${PRODUCTOS_SERVICE_URL:http://producto-service:8080}
              predicates:
                - Path=/api/v1/productos/**

            - id: productos-service-admin
              uri: ${PRODUCTOS_SERVICE_URL:http://producto-service:8080}
              predicates:
                - Path=/api/v1/admin/productos/**

            - id: rabbit-admin-service
              uri: ${RABBIT_SERVICE_HOST:http://rabbit-admin-service:8080}
              predicates:
                - Path=/api/admin/rabbit/**

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}