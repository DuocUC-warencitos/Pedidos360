server:
    port: ${SERVER_PORT:8080}

    spring:
        application:
            name: analytics-service
        security:
            oauth2:
                resourceserver:
                    jwt:
                        issuer-uri: ${JWT_ISSUER_URI:}
        jackson:
            default-property-inclusion: non_null

app:
    security:
        cors:
            enabled: ${CORS_ENABLED:true}
            allowed-origins: ${CORS_ALLOWED_ORIGINS:}