services:
    producto-service:
        image: ${GHCR_IMAGE_PRODUCTO:-ghcr.io/duocuc-warencitos/producto-service:latest}
        container_name: producto-service
        env_file: .env
        # CORS en AWS: true por defecto (o CORS_ENABLED/CORS_ALLOWED_ORIGINS del .env).
        # En local los servicios van false porque el gateway local maneja CORS.
        environment:
            SERVER_PORT: 8080
        ports:
            - "8080:8080"
        restart: unless-stopped
