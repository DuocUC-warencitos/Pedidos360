services:
    pedidos-angular-app:
        build:
            context: ../../frontend
        container_name: pedidos-angular-app
        environment:
            MSAL_CLIENT_ID: ${MSAL_CLIENT_ID:-}
            MSAL_TENANT_ID: ${MSAL_TENANT_ID:-}
            MSAL_REDIRECT_URI: ${MSAL_REDIRECT_URI:-}
            MSAL_POST_LOGOUT_URI: ${MSAL_POST_LOGOUT_URI:-}
            MSAL_API_SCOPE: ${MSAL_API_SCOPE:-}
            API_GATEWAY_URL: ${API_GATEWAY_URL:-}
            ANGULAR_LOG_LEVEL: ${ANGULAR_LOG_LEVEL}
            ANGULAR_IS_PRODUCTION: ${ANGULAR_IS_PRODUCTION:-}
        ports:
            - "80:80"
        depends_on:
            - pedidos-gateway

    pedidos-gateway:
        build:
            context: ../../backend/pedidos-gateway
            dockerfile: Dockerfile
        container_name: pedidos-gateway
        environment:
            JWT_ISSUER_URI: ${JWT_ISSUER_URI}
            PEDIDOS_SERVICE_URL: ${PEDIDOS_SERVICE_HOST:-}
            PRODUCTOS_SERVICE_URL: ${PRODUCTO_SERVICE_HOST:-}
            RABBIT_SERVICE_HOST: ${RABBIT_SERVICE_HOST:-}
            CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS_GATEWAY:-}
        depends_on:
            - producto-service
            - pedidos-service
            - rabbit-admin-service

    pedidos-service:
        build:
            context: ../../backend/pedidos-service
        container_name: pedidos-service
        environment:
            JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
            SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_PEDIDOS:-}
            SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_PEDIDOS:-}
            SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_PEDIDOS:-}
            PRODUCTO_SERVICE_URL: ${PRODUCTO_SERVICE_HOST:-}
            CORS_ENABLED: false
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
            RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
        depends_on:
            - producto-service
            - rabbitmq

    producto-service:
        build:
            context: ../../backend/producto-service
        container_name: producto-service
        environment:
            JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
            SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_PRODUCTOS:-}
            SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_PRODUCTOS:-}
            SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_PRODUCTOS:-}
            CORS_ENABLED: false

    rabbit-admin-service:
        build:
            context: ../../backend/rabbitmq_admin_service
        container_name: rabbit-admin-service
        environment:
            JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
            SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_RABBIT:-}
            SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_RABBIT:-}
            SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_RABBIT:-}
            CORS_ENABLED: false
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
            RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
        depends_on:
            - rabbitmq

    rabbitmq:
        image: rabbitmq:3-management
        container_name: rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
