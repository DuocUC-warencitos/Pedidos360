name: pedidos360
services:
    pedidos-angular-app:
        build:
            context: ../../frontend
        container_name: pedidos-angular-app
        environment:
            MSAL_CLIENT_ID: ${MSAL_CLIENT_ID:-}
            MSAL_TENANT_ID: ${MSAL_TENANT_ID:-}
            MSAL_REDIRECT_URI: ${MSAL_REDIRECT_URI:-}
            MSAL_POST_LOGOUT_URI: ${MSAL_POST_LOGOUT_URI:-}
            MSAL_API_SCOPE: ${MSAL_API_SCOPE:-}
            API_GATEWAY_URL: ${API_GATEWAY_URL:-}
            ANGULAR_LOG_LEVEL: ${ANGULAR_LOG_LEVEL}
            ANGULAR_IS_PRODUCTION: ${ANGULAR_IS_PRODUCTION:-}
        ports:
            - "80:80"
        depends_on:
            - pedidos-gateway

    pedidos-gateway:
        build:
            context: ../../backend/pedidos-gateway
            dockerfile: Dockerfile
        container_name: pedidos-gateway
        environment:
            JWT_ISSUER_URI: ${JWT_ISSUER_URI}
            PEDIDOS_SERVICE_URL: ${PEDIDOS_SERVICE_HOST:-}
            PRODUCTOS_SERVICE_URL: ${PRODUCTO_SERVICE_HOST:-}
            RABBIT_SERVICE_HOST: ${RABBIT_SERVICE_HOST:-}
            CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS_GATEWAY:-}
        depends_on:
            - producto-service
            - pedidos-service
            - rabbit-admin-service

    pedidos-service:
        build:
            context: ../../backend/pedidos-service
        container_name: pedidos-service
        environment:
            JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
            SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_PEDIDOS:-}
            SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_PEDIDOS:-}
            SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_PEDIDOS:-}
            PRODUCTO_SERVICE_URL: ${PRODUCTO_SERVICE_HOST:-}
            INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
            CORS_ENABLED: false
            RABBITMQ_HOST: ${RABBITMQ_HOST}
            RABBITMQ_PORT: ${RABBITMQ_PORT}
            RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
            RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
        depends_on:
            - producto-service
            - rabbitmq

    producto-service:
        build:
            context: ../../backend/producto-service
        container_name: producto-service
        environment:
            JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
            SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_PRODUCTOS:-}
            SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_PRODUCTOS:-}
            SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_PRODUCTOS:-}
            INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
            CORS_ENABLED: false
            KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
        depends_on:
            - kafka

    rabbit-admin-service:
        build:
            context: ../../backend/rabbitmq_admin_service
        container_name: rabbit-admin-service
        environment:
            JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
            SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL_RABBIT:-}
            SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME_RABBIT:-}
            SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD_RABBIT:-}
            CORS_ENABLED: false
            RABBITMQ_HOST: ${RABBITMQ_HOST}
            RABBITMQ_PORT: ${RABBITMQ_PORT}
            RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
            RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
            RABBITMQ_ADMIN_PORT: ${RABBITMQ_ADMIN_PORT}
            RABBITMQ_MANAGEMENT_URL: ${RABBITMQ_MANAGEMENT_URL}
        depends_on:
            - rabbitmq

    analytics-service:
        build:
            context: ../../backend/analytics-service
        container_name: analytics-service
        environment:
            JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
            CORS_ENABLED: false
            KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
        depends_on:
            - kafka

    rabbitmq:
        image: rabbitmq:3-management
        container_name: rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq

    kafka:
        image: apache/kafka:4.2.2
        container_name: query-analytics-kafka
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller

            KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092

            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

            KAFKA_NUM_PARTITIONS: 3
            KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: query-analytics-kafka-ui
        ports:
        - "8081:8080"
        environment:
            DYNAMIC_CONFIG_ENABLED: "true"
            KAFKA_CLUSTERS_0_NAME: query-analytics
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
        depends_on:
        - kafka

volumes:
  rabbitmq_data:
