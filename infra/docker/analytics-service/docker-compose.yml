services:
    analytics-service:
        image: ${GHCR_IMAGE_ANALYTICS:-ghcr.io/duocuc-warencitos/analytics-service:latest}
        container_name: analytics-service
        env_file: .env
        # CORS en AWS: true por defecto (o CORS_ENABLED/CORS_ALLOWED_ORIGINS del .env).
        # En local los servicios van false porque el gateway local maneja CORS.
        environment:
            SERVER_PORT: 8080
        ports:
            - "8080:8080"
        restart: unless-stopped
        # Kafka Streams guarda su estado local en /tmp/kafka-streams (efimero):
        # al recrear el contenedor se reconstruye desde los topicos de Kafka.
