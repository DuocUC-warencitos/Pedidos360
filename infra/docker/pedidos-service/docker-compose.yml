services:
    pedidos-service:
        image: ${GHCR_IMAGE_PEDIDOS:-ghcr.io/duocuc-warencitos/pedidos-service:latest}
        container_name: pedidos-service
        env_file: .env
        environment:
            SERVER_PORT: 8080
            CORS_ENABLED: "false"
        ports:
            - "8080:8080"
        restart: unless-stopped
