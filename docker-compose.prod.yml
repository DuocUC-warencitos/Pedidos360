# Prod EC2 - pull desde GHCR ghcr.io/neytan2214/* (públicas)
# Requiere .env en host EC2 (scp tu .env). Nunca bakeado en imagen.
# Uso en EC2 Linux:
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
# O con export: export $(cat .env | xargs) && docker compose -f docker-compose.prod.yml up -d
services:
  producto-service:
    image: ghcr.io/neytan2214/producto-service:${TAG:-latest}
    container_name: producto-service
    env_file: .env
    environment:
      SERVER_PORT: ${PRODUCTO_SERVER_PORT:-8080}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
    ports:
      - "${PRODUCTO_HOST_PORT:-8082}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  pedidos-service:
    image: ghcr.io/neytan2214/pedidos-service:${TAG:-latest}
    container_name: pedidos-service
    env_file: .env
    environment:
      SERVER_PORT: ${PEDIDOS_SERVER_PORT:-8080}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      PRODUCTO_SERVICE_URL: ${PRODUCTO_SERVICE_URL:-http://producto-service:8080}
    ports:
      - "${PEDIDOS_HOST_PORT:-8081}:8080"
    restart: unless-stopped
    depends_on:
      producto-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Gateway NO incluido en prod (reemplazado por AWS API Gateway)
  # Si quieres probar gateway en EC2, descomenta:
  # pedidos-gateway:
  #   image: ghcr.io/neytan2214/pedidos-gateway:${TAG:-latest}
  #   env_file: .env
  #   ports: ["8080:8080"]
  #   restart: unless-stopped
